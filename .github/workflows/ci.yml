name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lower bound (package.json engines.node), the previous LTS, and
        # current — catches a regression against the floor we actually
        # advertise, not just whatever happens to be newest.
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run corpus

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Enforces vitest.config.ts's coverage thresholds — a real gate, not
      # just a report: this step (and the job) fails if coverage regresses
      # below them. Runs once (not across the full Node matrix above) since
      # V8 coverage isn't meaningfully Node-version-sensitive here.
      - run: npm run coverage
      # Feeds the live README badge. fail_ci_if_error defaults to false —
      # a Codecov outage or a not-yet-configured CODECOV_TOKEN secret
      # shouldn't fail this repo's own CI; the coverage thresholds above
      # already are the real gate.
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
