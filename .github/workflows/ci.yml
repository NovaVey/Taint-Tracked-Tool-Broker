name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lower bound (package.json engines.node), the previous LTS, and
        # current — catches a regression against the floor we actually
        # advertise, not just whatever happens to be newest.
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Everything above/below this line exercises src/ TypeScript through
      # either tsc's *type checker* (typecheck) or esbuild's transpilation
      # (vitest/tsx, for test/corpus) — never the actual JavaScript tsc
      # emits into dist/, which is the exact thing `npm publish` ships.
      # This step closes that gap: it loads dist/index.js with Node's own
      # ESM loader (no transpiler in between) and runs one real gated call
      # through it, so a regression confined to tsc's emit can't reach npm
      # invisibly. See scripts/smoke-test-dist.mjs's header for the full
      # rationale, and GAPS.md's CI-coverage entry. Run across the whole
      # Node matrix, not just one version, since the thing under test here
      # is specifically "does compiled dist/ load and run correctly under
      # Node's ESM loader" — that is exactly the kind of behavior that can
      # legitimately vary by Node version, unlike the coverage job below.
      - run: node scripts/smoke-test-dist.mjs
      # Same rationale, applied to the SEPARATE shipped artifact `tttb doctor`
      # is: dist/cli/doctor.js, package.json's "bin" entry — not a module
      # export smoke-test-dist.mjs already covers. See
      # scripts/smoke-test-doctor-cli.mjs's own header.
      - run: node scripts/smoke-test-doctor-cli.mjs
      - run: npm test
      - run: npm run corpus

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Enforces vitest.config.ts's coverage thresholds — a real gate, not
      # just a report: this step (and the job) fails if coverage regresses
      # below them. Runs once (not across the full Node matrix above) since
      # V8 coverage isn't meaningfully Node-version-sensitive here.
      - run: npm run coverage

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
