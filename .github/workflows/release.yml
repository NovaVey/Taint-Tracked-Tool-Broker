name: Release

# Tag-triggered publish to npm with provenance attestation, plus a GitHub
# Release (so the tag actually gets the "Latest" badge on the repo's
# Releases page — a git tag alone does not create one). Push a tag matching
# v<package.json version> (e.g. `git tag v0.2.0 && git push origin v0.2.0`)
# to publish that exact commit.
#
# Requires an `NPM_TOKEN` repository secret (an npm automation/publish
# token for this package) — see https://docs.npmjs.com/creating-and-viewing-access-tokens.
# Without it this workflow runs the same validation as CI and then fails
# at the publish step with an auth error, rather than silently no-op'ing.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create the GitHub Release below
  id-token: write # required for npm provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci

      # A tagged release for a version this package.json doesn't actually
      # have is almost always a mistake (forgot to bump package.json, or
      # tagged the wrong ref) — fail loud before doing any real work.
      - name: Verify the pushed tag matches package.json's version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      # Same validation CI already runs on every push/PR — re-run here too
      # rather than trusting that whatever CI run happened to pass earlier
      # on this commit is still what's about to be published.
      - run: npm run typecheck

      # CI enforces lint/format/coverage as separate dedicated jobs
      # (.github/workflows/ci.yml), not as steps in the same job that runs
      # typecheck/build/smoke-test/test/corpus — so a tag pointing at a
      # commit whose CI run doesn't actually reflect the current code (or a
      # manual tag pushed without waiting for CI) could otherwise reach
      # publish without ever having been lint/format/coverage-checked. Rerun
      # all three here too, for the same reason the steps below re-run
      # typecheck/build/test/corpus: gate-parity with CI, not trust that an
      # earlier run still applies. See CONTRIBUTING.md's "all seven checks
      # must pass" list.
      - run: npm run lint
      - run: npm run format:check
      - run: npm run coverage

      - run: npm run build
      # Same rationale as ci.yml's identical step: typecheck/test/corpus
      # above and below all exercise src/ TypeScript, never the actual
      # dist/ JavaScript this workflow is about to publish. This loads
      # dist/index.js with Node's own ESM loader and runs one real gated
      # call through it, so a regression confined to tsc's emit can't
      # reach npm invisibly. See scripts/smoke-test-dist.mjs's header.
      - run: node scripts/smoke-test-dist.mjs
      # Same rationale, applied to the SEPARATE shipped artifact `tttb doctor`
      # is: dist/cli/doctor.js, package.json's "bin" entry. See
      # scripts/smoke-test-doctor-cli.mjs's own header.
      - run: node scripts/smoke-test-doctor-cli.mjs
      - run: npm test
      - run: npm run corpus

      # Recovery affordance for the failure mode where `npm publish` below
      # succeeds but the "Create GitHub Release" step after it fails
      # (transient GitHub API error, rate limiting, an org policy on
      # Actions-created releases, etc.). GitHub Actions' only built-in
      # recovery — "re-run failed jobs" — reruns this whole job from the
      # top, which would otherwise hit `npm publish` again for a version
      # that's already live and fail every time with a 403, never reaching
      # the release step again. Checking the registry first and skipping a
      # redundant publish makes a re-run land on "Create GitHub Release"
      # instead, restoring an idempotent path back to a consistent state.
      # `npm view pkg@version version` exits 0 with output only when that
      # exact version is already published, and non-zero (E404) otherwise —
      # no auth needed to query a public package's own metadata.
      - name: Check whether this version is already on npm
        id: npm-check
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "Already published — skipping npm publish."
            echo "already-published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: npm publish
        if: steps.npm-check.outputs.already-published != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Runs after a successful publish above (or, on a re-run following the
      # recovery path above, after publish was skipped because this version
      # is already on npm) — either way the version is confirmed live on
      # npm by this point, so a GitHub Release for it is never misleading.
      # A skipped step does not count as a failure for `success()`, which is
      # this step's implicit default condition, so no explicit `if` is
      # needed here to reach it after the publish step above is skipped.
      # `gh` is preinstalled on GitHub-hosted runners, so this needs no
      # third-party Action (see CHANGELOG's earlier decision against adding
      # one just for a coverage badge — same reasoning applies here).
      # --generate-notes pulls titles from PRs merged since the last tag;
      # CHANGELOG.md remains the source of truth for full detail.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
